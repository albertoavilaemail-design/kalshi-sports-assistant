name: scan-markets
# One job does everything: scan + dashboard, live/halftime checks, paper trades, settlement.
# Hourly, plus every 10 minutes during typical game windows. GitHub cron is best-effort (often 15-20 min late),
# so while any game is live each run also starts the next one itself (~every 5 min) until no games are live.
on:
  push:
    branches: [main]              # runs automatically as soon as you upload/commit files
  schedule:
    - cron: "17 * * * *"          # every hour (free for public repos); keeps the dashboard fresh
    # extra runs every 10 min in typical game windows (UTC) for live/halftime checks
    - cron: "*/10 11-23 * * 0,6"
    - cron: "*/10 0-4 * * 0,1"
    - cron: "*/10 23 * * 1,4,5"
    - cron: "*/10 0-3 * * 2,5,6"
    - cron: "*/10 18-21 * * 2,3"
  workflow_dispatch:
    inputs:
      chained:
        description: "Started automatically by a previous run because games were live"
        required: false
        default: "false"
      depth:
        description: "How many chained runs in a row (safety cap)"
        required: false
        default: "0"
permissions:
  actions: write    # lets a run start the next one while games are live
  contents: write   # needed to save the database to the bot-state branch
  pages: write      # publish the dashboard
  id-token: write
concurrency:
  group: bot-state          # one state-changing run at a time; later runs queue
  cancel-in-progress: false
jobs:
  scan:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ vars.KSA_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KSA_CONFIG: config/settings.example.yaml   # edit this file (no secrets) to change Actions behaviour
      KSA_DB_PATH: data/assistant.db
      KSA_LOG_LEVEL: WARNING
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Restore state
        run: bash scripts/state.sh pull
      - name: Scan Kalshi sports markets (results appear on this run's Summary page)
        run: |
          set -o pipefail
          mkdir -p reports
          kalshi-assistant scan --all --limit 15 --html site/index.html --live-file reports/live_games.count 2>&1 | tee reports/last_scan.txt
      - name: Publish results to the run Summary
        if: always()
        run: |
          echo "## Kalshi sports scan - $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat reports/last_scan.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "scan produced no output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Estimates only - not guarantees. Paper/recommendation mode." >> "$GITHUB_STEP_SUMMARY"
      - name: Live games, halftime reports and alerts (prints alerts if Telegram is not set up)
        run: kalshi-assistant monitor --pregame
      - name: Paper-trade the top picks (fake money) to measure whether the model beats the market
        # not on the extra 10-min or chained live runs, so paper trading keeps its usual pace
        if: (github.event_name == 'schedule' && github.event.schedule == '17 * * * *') || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.chained != 'true')
        run: kalshi-assistant paper auto --max 3
      - name: Settle finished paper trades
        run: kalshi-assistant paper settle
      - name: Save state
        if: always()
        run: bash scripts/state.sh push
      - name: Prepare dashboard
        if: always()
        run: test -f site/index.html || { mkdir -p site; echo '<meta charset=utf-8><p>Scan failed this hour - see the Actions tab.</p>' > site/index.html; }
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - name: Publish dashboard
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4
      - name: Keep the page updating while games are live
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPTH: ${{ inputs.depth || '0' }}
        run: |
          LIVE=$(cat reports/live_games.count 2>/dev/null || echo 0)
          echo "Live games: $LIVE (chain depth $DEPTH)"
          if [ "${LIVE:-0}" -gt 0 ] && [ "$DEPTH" -lt 90 ]; then
            # pace runs about 5 minutes apart (each run takes 2-4 min)
            ELAPSED=$(( $(date +%s) - RUN_START ))
            [ "$ELAPSED" -lt 270 ] && sleep $(( 270 - ELAPSED ))
            gh workflow run scan_markets.yml --ref "${{ github.ref_name }}" -f chained=true -f depth=$(( DEPTH + 1 ))
            echo "Started the next live update."
          else
            echo "No live games (or safety cap reached); back to the regular schedule."
          fi
