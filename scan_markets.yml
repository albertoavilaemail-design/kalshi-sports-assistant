name: scan-markets
# Pregame scan + settlement of finished paper trades, a few times per day.
on:
  push:
    branches: [main]              # runs automatically as soon as you upload/commit files
  schedule:
    - cron: "17 13,17,21 * * *"   # UTC (8:17am, 12:17pm, 4:17pm Central during CDT)
  workflow_dispatch:
permissions:
  contents: write   # needed to save the database to the bot-state branch
concurrency:
  group: bot-state          # one state-changing run at a time; later runs queue
  cancel-in-progress: false
jobs:
  scan:
    if: ${{ vars.KSA_DISABLED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KSA_CONFIG: config/settings.example.yaml   # edit this file (no secrets) to change Actions behaviour
      KSA_DB_PATH: data/assistant.db
      KSA_LOG_LEVEL: WARNING
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Restore state
        run: bash scripts/state.sh pull
      - name: Scan Kalshi sports markets (results appear on this run's Summary page)
        run: |
          set -o pipefail
          kalshi-assistant scan --all --limit 15 2>&1 | tee scan.txt
      - name: Publish results to the run Summary
        if: always()
        run: |
          echo "## Kalshi sports scan - $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat scan.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "scan produced no output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Estimates only - not guarantees. Paper/recommendation mode." >> "$GITHUB_STEP_SUMMARY"
      - name: Pregame alerts to Telegram (skipped quietly if Telegram secrets are not set)
        run: kalshi-assistant monitor --pregame
      - name: Settle finished paper trades
        run: kalshi-assistant paper settle
      - name: Save state
        if: always()
        run: bash scripts/state.sh push
